<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>Assistant</title>
  <!-- Canvas — matches --lm-canvas; also the Electron dock icon source -->
  <rect width="32" height="32" rx="8" fill="#07070A"/>
  <!-- Soft outer halo -->
  <circle cx="16" cy="16" r="12" fill="url(#halo)"/>
  <!-- Thinking arcs (static, readable at favicon size) -->
  <circle
    cx="16" cy="16" r="10.5"
    stroke="url(#arcA)"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-dasharray="18 48"
    transform="rotate(-40 16 16)"
  />
  <circle
    cx="16" cy="16" r="7.5"
    stroke="url(#arcB)"
    stroke-width="1"
    stroke-linecap="round"
    stroke-dasharray="12 36"
    transform="rotate(110 16 16)"
  />
  <!-- Core -->
  <circle cx="16" cy="16" r="4.25" fill="url(#core)"/>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="arcA" x1="6" y1="8" x2="26" y2="24">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="arcB" x1="22" y1="10" x2="10" y2="24">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
