name: Feature Request
description: Suggest an idea or capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need or pain point, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you didn't pick them.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This fits LocalMind's local-first / audit-everything principles
        - label: This would not require sending user data to external services without explicit opt-in
