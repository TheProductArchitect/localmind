name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    # Run on ALL pull requests, regardless of target branch, so a contributor
    # opening a PR against a long-lived feature branch still gets the green/red.
    branches: [ "**" ]
  # Allow manual reruns from the Actions tab when chasing flakes.
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new push arrives — saves CI
# minutes and gives faster signal on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      LOCALMIND_JWT_SECRET: supersecrettesting
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Linter
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      - name: Run Type Check (if you have explicitly set one)
        run: npx tsc --noEmit
        
      - name: Build Application
        run: npm run build

      # The isolation test assumes a fresh database. The build step can touch
      # SQLite via any debug/route module that pre-renders, so we wipe the
      # data dir AND point the runtime at an isolated path before starting.
      - name: Reset SQLite data dir for isolation test
        run: |
          rm -rf /tmp/localmind-ci-data
          mkdir -p /tmp/localmind-ci-data

      - name: Start Application in Background
        env:
          LOCALMIND_DATA_DIR: /tmp/localmind-ci-data
        run: npm run start &
        
      - name: Wait for server to boot
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000 > /dev/null && break
            echo "Waiting for Next.js to start..."
            sleep 2
          done
          
      - name: Run Isolation Checks
        run: npm run test:isolation
