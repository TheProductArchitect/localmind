name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Linter
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      - name: Run Type Check (if you have explicitly set one)
        run: npx tsc --noEmit
        
      - name: Build Application
        run: npm run build
        
      - name: Start Application in Background
        run: npm run start &
        
      - name: Wait for server to boot
        run: |
          for i in {1..30}; do
            curl -s http://localhost:3000 > /dev/null && break
            echo "Waiting for Next.js to start..."
            sleep 2
          done
          
      - name: Run Isolation Checks
        run: npm run test:isolation
