name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Linter
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test
        
      - name: Run Type Check (if you have explicitly set one)
        run: npx tsc --noEmit
        
      - name: Run Isolation Checks
        run: npm run test:isolation
        
      - name: Build Application
        run: npm run build
